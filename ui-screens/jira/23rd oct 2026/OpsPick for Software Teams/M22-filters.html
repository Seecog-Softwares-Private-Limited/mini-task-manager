<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpsPick — Filters</title><link rel="stylesheet" href="m.css"></head>
<body><div class="phone"><div class="notch"></div>
<div class="sb"><span>9:41</span><span class="ic"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg><svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 2.2c2.1 0 4 .8 5.4 2.1l1.1-1.1A9.2 9.2 0 007.5.6 9.2 9.2 0 001 3.2l1.1 1.1a7.6 7.6 0 015.4-2.1zm0 3.1c1.2 0 2.4.5 3.2 1.3l1.1-1.1a6 6 0 00-8.6 0l1.1 1.1c.9-.8 2-1.3 3.2-1.3zm0 3.1c-.5 0-1 .2-1.3.5L7.5 10.5l1.3-1.6c-.3-.3-.8-.5-1.3-.5z"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="currentColor"/><rect x="23" y="4" width="1.5" height="4" rx=".7" fill="currentColor" opacity=".4"/></svg></span></div><div class="appbar under"><h1>Issues</h1></div><div class="scroll bg"></div>
<div class="dim"></div>
<div class="sheet"><div class="handle"></div>
<div class="between" style="margin-bottom:14px"><h3>Filter issues</h3><b style="font-size:13px;color:var(--ind)">Clear all</b></div>
<div style="overflow-y:auto;flex:1">
<div class="field"><label>Assignee</label><div class="chips"><span class="chip on"><span class="av" style="width:20px;height:20px;font-size:9px;background:#5b5bd6">AC</span>Me</span><span class="chip"><span class="av" style="width:20px;height:20px;font-size:9px;background:#0ea5e9">MP</span>Morgan</span><span class="chip"><span class="av" style="width:20px;height:20px;font-size:9px;background:#14b8a6">JL</span>Jordan</span><span class="chip">Unassigned</span></div></div>
<div class="field"><label>Status</label><div class="chips"><span class="chip on">To do</span><span class="chip on">In progress</span><span class="chip on">In review</span><span class="chip">Done</span></div></div>
<div class="field"><label>Type</label><div class="chips"><span class="chip"><span class="it" style="background:#e5484d;width:14px;height:14px"><svg width="12" height="12" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="#fff"/></svg></span>Bug</span><span class="chip"><span class="it" style="background:#22a06b;width:14px;height:14px"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M8 5.5h8v13l-4-3.2-4 3.2z" fill="#fff"/></svg></span>Story</span><span class="chip"><span class="it" style="background:#3b82f6;width:14px;height:14px"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Task</span><span class="chip"><span class="it" style="background:#8b5cf6;width:14px;height:14px"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M13.5 4L7 13.5h4.5L10.5 20 17 10.5h-4.5z" fill="#fff"/></svg></span>Epic</span></div></div>
<div class="field"><label>Priority</label><div class="chips"><span class="chip on"><svg width="14" height="14" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="#e5484d"/><path d="M12 7v6M12 16.5v.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>Urgent</span><span class="chip on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/><path d="M6 19l6-6 6 6" opacity=".45"/></svg>High</span><span class="chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.8" stroke-linecap="round"><path d="M5 9h14M5 15h14"/></svg>Medium</span><span class="chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6 6 6-6"/></svg>Low</span></div></div>
<div class="field"><label>More</label><div class="list">
<div class="li"><div class="t"><b>Project</b></div><span class="val">All</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
<div class="li"><div class="t"><b>Sprint</b></div><span class="val">Current sprints</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
<div class="li"><div class="t"><b>Labels</b></div><span class="val">Any</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
<div class="li"><div class="t"><b>Due date</b></div><span class="val">Any time</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div></div></div>
</div>
<div class="row" style="gap:10px;padding-top:12px"><button class="btn sec2" style="flex:1">Save as view</button><button class="btn" style="flex:1.4">Show 7 issues</button></div>
</div>
</div></body></html>
