# Reverse proxy for OpsPick on AWS Lightsail.
# Port 80 is reachable from mobile networks; port 3000 is often blocked on cellular data.
#
# Install on the server (SSH as bitnami):
#   sudo cp deploy/nginx-minitask.conf /etc/nginx/sites-available/minitask
#   sudo ln -sf /etc/nginx/sites-available/minitask /etc/nginx/sites-enabled/minitask
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires Next.js / PM2 listening on 127.0.0.1:3000

server {
    listen 80;
    server_name 3.110.214.243;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
