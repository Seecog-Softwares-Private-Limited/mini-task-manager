<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Clipboard body -->
  <rect x="8" y="10" width="16" height="18" rx="2" fill="white" opacity="0.95"/>
  <!-- Clipboard clip top piece -->
  <rect x="12" y="7" width="8" height="5" rx="1.5" fill="white" opacity="0.95"/>
  <!-- Hole cutout in clip -->
  <rect x="13.5" y="6" width="5" height="3" rx="1" fill="url(#bg)"/>
  <!-- Checkmark -->
  <polyline points="11,19 14.5,23 21,14" fill="none"
            stroke="#FF4500" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
